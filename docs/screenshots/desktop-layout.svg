<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Desktop Layout Screenshot -->
  <title>Desktop Layout (>768px)</title>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f4f4f4"/>
  
  <!-- Browser Chrome -->
  <rect width="1200" height="30" fill="#e0e0e0"/>
  <circle cx="15" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="35" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="55" cy="15" r="6" fill="#27c93f"/>
  <text x="600" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">WebUp Industrial Engineering - Desktop View</text>
  
  <!-- Fixed Navigation Bar -->
  <rect y="30" width="1200" height="48" fill="#3d2f21"/>
  
  <!-- Logo in Nav -->
  <rect x="20" y="38" width="32" height="32" rx="4" fill="#ddd"/>
  <text x="36" y="58" text-anchor="middle" font-family="Arial" font-size="10" fill="#3d2f21">⚙</text>
  
  <!-- Navigation Menu Items -->
  <rect x="450" y="42" width="80" height="32" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="490" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Home</text>
  
  <rect x="540" y="42" width="80" height="32" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
  <text x="580" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">About</text>
  
  <rect x="630" y="42" width="90" height="32" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
  <text x="675" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Contact</text>
  
  <rect x="730" y="42" width="100" height="32" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
  <text x="780" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Projects ▾</text>
  
  <!-- Header with Title -->
  <rect y="78" width="1200" height="60" fill="#3d2f21"/>
  <text x="600" y="115" text-anchor="middle" font-family="Arial" font-size="24" fill="#fff" font-weight="bold">WebUp Industrial Engineering</text>
  
  <!-- Main Content Area -->
  <rect y="138" width="1200" height="602" fill="#f4f4f4"/>
  
  <!-- Content -->
  <text x="100" y="180" font-family="Arial" font-size="20" fill="#333" font-weight="bold">Professional Metal Fabrication &amp; CNC Machining</text>
  <text x="100" y="210" font-family="Arial" font-size="14" fill="#666">High-quality industrial engineering solutions for your manufacturing needs</text>
  
  <!-- Gallery Grid (5 images in 3-2 layout) -->
  <!-- Row 1 - 3 images -->
  <g transform="translate(100, 250)">
    <rect width="250" height="250" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="230" height="230" fill="#999"/>
    <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Project 1</text>
  </g>
  
  <g transform="translate(400, 240) rotate(-3 125 125)">
    <rect width="250" height="250" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="230" height="230" fill="#888"/>
    <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Project 2</text>
  </g>
  
  <g transform="translate(700, 250)">
    <rect width="250" height="250" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="230" height="230" fill="#777"/>
    <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Project 3</text>
  </g>
  
  <!-- Row 2 - 2 images -->
  <g transform="translate(250, 540) rotate(3 125 125)">
    <rect width="250" height="250" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="230" height="230" fill="#666"/>
    <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Project 4</text>
  </g>
  
  <g transform="translate(550, 550) rotate(-6 125 125)">
    <rect width="250" height="250" fill="#fff" rx="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="230" height="230" fill="#555"/>
    <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Project 5</text>
  </g>
  
  <!-- Footer (partially visible) -->
  <rect y="740" width="1200" height="60" fill="#3d2f21"/>
  <text x="600" y="765" text-anchor="middle" font-family="Arial" font-size="11" fill="#ddd">© 2025 WebUp Industrial Engineering</text>
  <text x="600" y="785" text-anchor="middle" font-family="Arial" font-size="10" fill="#ddd">✓ Valid HTML5 | ✓ Valid CSS3</text>
  
  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dimension indicator -->
  <text x="1100" y="790" font-family="Arial" font-size="11" fill="#999">Desktop: 1200×800px</text>
</svg>
